
###### OS Logs ######
[WinEventLog://Application]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
renderXml=true
index = win
sourcetype = XmlWinEventLog
source = XmlWinEventLog:Application

[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
evt_resolve_ad_obj = 1
checkpointInterval = 5
blacklist1 = EventCode="4662" Message="Object Type:(?!\s*groupPolicyContainer)"
blacklist2 = EventCode="566" Message="Object Type:(?!\s*groupPolicyContainer)"
renderXml=true
index = win
sourcetype = XmlWinEventLog
source = XmlWinEventLog:Security

[WinEventLog://System]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
renderXml=true
index = win
sourcetype = XmlWinEventLog
source = XmlWinEventLog:System

###### WinEventLog Inputs for Active Directory ######

## Application and Services Logs - DFS Replication
[WinEventLog://DFS Replication]
disabled = 0
renderXml=true
index = win
sourcetype = XmlWinEventLog

## Application and Services Logs - Directory Service
[WinEventLog://Directory Service]
disabled = 0
renderXml=true
index = win
sourcetype = XmlWinEventLog

## Application and Services Logs - File Replication Service
[WinEventLog://File Replication Service]
disabled = 0
renderXml=true
index = win
sourcetype = XmlWinEventLog

## Application and Services Logs - Key Management Service
[WinEventLog://Key Management Service]
disabled = 0
renderXml=true
index = win
sourcetype = XmlWinEventLog

## ADMon ##
[admon://ADMonitoring]
targetDc = {single-dc}
monitorSubtree = 1
baseline = 1
index = win
disabled = false
sourcetype = XmlWinEventLog

###### WinEventLog Inputs for DNS ######
[WinEventLog://DNS Server]
disabled=0
renderXml=true
index = dns
sourcetype = XmlWinEventLog


###### DHCP ######
[monitor://$WINDIR\System32\DHCP]
disabled = 0
whitelist = DhcpSrvLog*
crcSalt = <SOURCE>
sourcetype = DhcpSrvLog
sourcetype = XmlWinEventLog
