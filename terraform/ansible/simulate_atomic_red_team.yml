---
# Playbook to run Atomic Red Team via p4t12ick.ar_atomic_red_team (Ansible Galaxy).
#
# Extra vars (from API POST /attack-range/simulate or CLI):
#   techniques: ["T1003.001"]     — run all atomics for each technique
#   atomics:                      — run specific tests only
#     - technique: T1003.001
#       guid: <auto_generated_guid from ART YAML>
#   atomic_files:                 — deploy and run custom atomic YAML from controller
#     - path: /path/on/controller/custom.yaml
#     - content: |
#         attack_technique: T9999
#         ...
- hosts: "{{ target_host }}"
  gather_facts: true
  # Note: become is handled by the role internally for Linux tasks
  # Windows hosts don't support become, so we don't set it at playbook level
  vars:
    ar_atomic_red_team_techniques: "{{ techniques | default([]) }}"
    ar_atomic_red_team_atomics: "{{ atomics | default([]) }}"
    ar_atomic_red_team_atomic_files: "{{ atomic_files | default([]) }}"
  roles:
    - p4t12ick.ar_atomic_red_team

  post_tasks:
    - name: Simulate playbook execution status
      debug:
        msg:
          status: "{{ 'failed' if (ar_atomic_red_team_execution_summary.failed | default(0) | int) > 0 else 'success' }}"
          summary: "{{ ar_atomic_red_team_execution_summary | default({}) }}"
          results: "{{ ar_atomic_red_team_execution_results | default([]) }}"
      when: ar_atomic_red_team_execution_results | default([]) | length > 0
      changed_when: false
